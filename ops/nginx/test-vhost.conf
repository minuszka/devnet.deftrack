# An isolated nginx that serves the built client the way production does,
# on a spare port, in its own prefix, touching nothing that is running.
#
# It is a copy of the live vhost's SHAPE -- the same three locations, the same
# try_files, the same per-location Cache-Control -- with the TLS, the proxy and
# the default-server refusal removed, because none of those is what this is
# measuring. What it is measuring is which headers come out of which location,
# including the 404, which is the part a browser check on `/` cannot see.
#
# Run it with ops/nginx/verify-headers.sh; do not install this file.

worker_processes 1;
daemon off;
pid /tmp/deftrack-nginx-test/nginx.pid;
error_log /tmp/deftrack-nginx-test/error.log warn;

events { worker_connections 64; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /tmp/deftrack-nginx-test/access.log;
    client_body_temp_path /tmp/deftrack-nginx-test/body;
    proxy_temp_path       /tmp/deftrack-nginx-test/proxy;
    fastcgi_temp_path     /tmp/deftrack-nginx-test/fastcgi;
    uwsgi_temp_path       /tmp/deftrack-nginx-test/uwsgi;
    scgi_temp_path        /tmp/deftrack-nginx-test/scgi;

    server {
        listen 127.0.0.1:8099;
        server_name localhost;

        root /tmp/deftrack-nginx-test/www;
        index index.html;

        include /tmp/deftrack-nginx-test/snippets/security-headers.conf;
        include /tmp/deftrack-nginx-test/snippets/csp-report-only.conf;

        # The SPA shell: never cached, so a deploy is picked up on the next
        # load. Note the re-include -- a location that adds any header of its
        # own drops every inherited one, and this is the shape that has to be
        # copied into the live vhost.
        location = /index.html {
            include /tmp/deftrack-nginx-test/snippets/security-headers.conf;
            include /tmp/deftrack-nginx-test/snippets/csp-report-only.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Content-hashed assets: the filename changes with the build.
        location /assets/ {
            include /tmp/deftrack-nginx-test/snippets/security-headers.conf;
            include /tmp/deftrack-nginx-test/snippets/csp-report-only.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # A location that adds NOTHING of its own, to prove the inheritance
        # rule from the other side: these responses must still carry the
        # server-level set.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # A deliberate 404 that does not fall through to the SPA, so the
        # `always` behaviour is measured on a real error response.
        location = /__missing {
            return 404 "not here\n";
        }
    }
}
