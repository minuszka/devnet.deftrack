# Content-Security-Policy for the devnet.deftrack HTML entry point.
#
# REPORT-ONLY FIRST, and this file is the report-only one. Its enforcing twin
# is csp-enforce.conf, and the two carry the same policy text on purpose: the
# promotion is a one-word change of include, not a rewrite, so what was
# measured is what is enforced.
#
# WHAT THE POLICY HAD TO ACCOMMODATE, measured against the built bundle rather
# than assumed (ops/nginx/README.md records the run):
#
#   script-src 'self'
#     The built page loads one module script from /assets and imports its
#     chunks dynamically. There is no inline <script> in index.html, so no
#     'unsafe-inline' and no nonce machinery is needed -- which is the whole
#     reason this policy is worth having.
#
#   style-src 'self' 'unsafe-inline'
#     The one relaxation, and it was measured rather than assumed. Tightening
#     it to `style-src 'self'` and running the built app produced violations of
#     exactly one directive -- style-src-attr -- and none at all from Lit.
#
#     So the cause is the 31 inline `style=` attributes the components carry:
#     bar widths and flex shares computed per row, which is what they are for.
#     There is no hash or nonce form for a style attribute a template computes.
#     Lit is NOT the cause: on every browser with adoptedStyleSheets (Chromium,
#     Firefox 101+, Safari 16.4+) its `css` templates become constructable
#     stylesheets, which CSP does not police, and the measurement shows that.
#
#     The narrower `style-src 'self'; style-src-attr 'unsafe-inline'` would
#     therefore be enough HERE, and is deliberately not used: it fails closed
#     on a browser that lacks either CSP3's style-src-attr (older Firefox, which
#     would then block the attributes under style-src) or adoptedStyleSheets
#     (older Safari, where Lit falls back to injecting <style> elements and the
#     page would render unstyled). Both failures are silent and neither can be
#     measured from the one browser this suite drives.
#
#     Tightening it properly means removing the computed style attributes, not
#     narrowing the directive. That is a client change, not a header change.
#
#   connect-src 'self'
#     Every request the page makes is same-origin /api/v1. The browser tests
#     refuse anything else by construction, so this is the same rule the test
#     harness already enforces, now enforced by the browser.
#
#   img-src 'self' data:
#     `data:` because favicons and inline SVG data URIs are used; no remote
#     image host is contacted.
#
#   frame-ancestors 'none'
#     The CSP equivalent of the X-Frame-Options already present, and the one
#     modern browsers actually consult. Both are sent: the header is cheap and
#     the older one still has readers.
#
#   base-uri 'none', form-action 'none', object-src 'none'
#     The page has no <base>, no <form> that posts anywhere, and no plugins.
#     Denying outright is free here and closes three classic injection routes.
#
#   upgrade-insecure-requests
#     Belt and braces beside HSTS.
#
# NO report-uri / report-to: there is no collector on this deployment, and
# pointing one at a host that does not exist produces console noise that reads
# like a fault. Report-only without a collector still surfaces every violation
# in the browser console and in `securitypolicyviolation` events, which is what
# the verification uses. Add a collector when there is one to add.

add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests" always;
