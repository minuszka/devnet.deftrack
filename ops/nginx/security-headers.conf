# Security headers for the devnet.deftrack HTML entry point.
#
# WHY THIS IS A SNIPPET AND NOT FOUR LINES IN THE SERVER BLOCK
#
# nginx's `add_header` does not accumulate across levels. A `location` that
# declares even one `add_header` of its own REPLACES every `add_header`
# inherited from the server block -- all of them, silently. The live vhost
# already worked around that by repeating the same four headers in three
# places, which is correct and is also exactly how a fifth header comes to be
# added in two of them and forgotten in the third.
#
# So: this file is the whole set, and every location that needs any header of
# its own includes it and then adds what is particular to that location.
#
#   include /etc/nginx/snippets/deftrack-security-headers.conf;
#   add_header Cache-Control "no-cache" always;
#
# `always` on every one of them: without it nginx omits the header on error
# responses (4xx/5xx), and a 404 served from this site is a page like any
# other. The audit's evidence was taken on `/`, `/rounds` and `/admin`; a
# policy that is absent on the 404 is a policy with a hole in it.

# Already live, kept verbatim so this snippet is a superset and the change is
# additive.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS on the HTML entry point.
#
# The API already sends it through helmet, and that is not the same thing: a
# browser that loads the document over http and never touches /api/ is never
# told. Two years, subdomains included.
#
# NO `preload`, deliberately. Preloading is a one-way submission to a list
# baked into browsers, it covers the whole registrable domain, and
# deftrack.xyz serves more than this devnet. Out of scope for this work, and
# not something to acquire as a side effect.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
