# The enforcing twin of csp-report-only.conf.
#
# The policy text is identical, character for character after the header name,
# so promoting is swapping which file is included and nothing else. If the two
# ever diverge, ops/nginx/verify-headers.sh says so -- it compares them rather
# than trusting that somebody edited both.
#
# DO NOT include this one until the report-only run has been clean on the
# pages that matter, on the build that is actually deployed. A CSP that breaks
# the page is worse than no CSP: it fails closed, silently, in whichever
# browser the reader happens to be using.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests" always;
