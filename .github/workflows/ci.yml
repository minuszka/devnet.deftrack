name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A superseded run is wasted minutes and a red X on a commit nobody is looking
# at any more. The newest push on a ref is the only one whose answer matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    # A real MongoDB rather than an in-memory stand-in: the integration tests
    # exist to check MongoDB's own behaviour -- unique indexes, upsert races --
    # and a stand-in would be one more thing to trust. 8.0 is the branch the
    # devnet runs.
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions are pinned to a commit, not a tag. A tag is a movable pointer in
      # somebody else's repository, and `@v4` means "whatever they publish
      # next", which is a supply chain this build has no way to review. The
      # comment says which release the SHA was.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Lockfile-exact install across the shared/server/client workspaces.
      - name: Install
        run: npm ci

      # Fails on high and critical, prints everything else.
      #
      # Two moderate findings, both `qs`, and both reached only through
      # express's OWN direct `~6.15.1` pin. It was three: body-parser moved to
      # `qs@~6.16.0` in 1.20.8, which express's `~1.20.5` already allows, so a
      # lockfile update took that path out with no manifest change and no
      # override. 4.22.2 is the last express 4.x and nothing in the 4 line ever
      # moves off `~6.15.1`; the only upstream fix is express 5, a framework
      # major this work does not require.
      #
      # The earlier decision stands, re-checked rather than repeated: an
      # `overrides` entry would violate a range express itself declares, to fix
      # a vulnerability this server does not have. Neither advisory is
      # reachable here -- `app.set('query parser', 'simple')` keeps qs out of
      # query parsing, and nothing mounts `express.urlencoded`, so no request
      # to this API reaches qs at all. That is an accepted moderate with a
      # named path, not a fixed one.
      #
      # So moderate is reported and high is refused, rather than the whole
      # thing being waved through with `|| true`.
      - name: Audit dependencies
        run: |
          npm audit || true
          npm audit --audit-level=high

      # Pinned by version and checksum, not `apt-get install shellcheck`. The
      # runner image ships 0.9, which reports SC2015 on six `A && B || die`
      # validations that 0.11 knows are fine because `die` exits -- so the same
      # tree passed here and failed there, and the gate would have meant
      # whatever version the image happened to carry that month.
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSLf --retry 3 -o /tmp/shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Verify chaos wrapper package
        run: npm run verify:chaos

      # server and client import @devnet-deftrack/shared as a built package, so
      # its declarations must exist before they can be typechecked. A local dev
      # tree already has shared/dist from an earlier build; a clean CI checkout
      # does not, which is exactly the gap this whole workflow closes.
      - name: Build shared
        run: npm run build -w shared

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The unit tests above never render anything. These do: they start a local
      # Vite server, load the real dd-shell and dd-admin-shell, and answer every
      # API call from a synthetic stub -- a request that is not stubbed is
      # refused and fails the test, so the suite cannot quietly start testing
      # whatever server happens to be reachable. A green run here is evidence
      # about the client alone: not the API, not MongoDB, not the devnet.
      #
      # The browser is chosen by the exact @playwright/test version in the
      # lockfile, so this installs whatever that pin asks for and nothing else.
      - name: Install the browser for the client tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests (client)
        run: npm run test:e2e -w client

      # Traces and failure screenshots, kept only when there is a failure to
      # explain. They contain synthetic fixture data by construction.
      - name: Upload browser-test artefacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-browser-tests
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
          if-no-files-found: ignore

      # The build is the release artefact, and the reason the deploy script
      # exists at all -- a green typecheck that does not actually bundle is not
      # a green deploy.
      - name: Build
        run: npm run build

      # After the build on purpose: the lab scripts import from server/dist, so
      # this checks the artefact they actually load. A rename in server/src
      # leaves them parsing perfectly and broken at run time.
      - name: Check ops imports
        run: npm run verify:ops

      # The claims that are about MongoDB rather than about our code: the unique
      # index that makes a round un-duplicatable, `$setOnInsert` keeping a first
      # observation immutable, and the public routes answered over documents
      # that really do carry a host address. A fake repository cannot fail any
      # of those, because a fake has no index and serves no HTTP.
      - name: Integration tests (real MongoDB)
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
        run: npm run test:integration

  scripts:
    name: Scripts, Dockerfile and units
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Pinned by version and checksum, not `apt-get install shellcheck`. The
      # runner image ships 0.9, which reports SC2015 on six `A && B || die`
      # validations that 0.11 knows are fine because `die` exits -- so the same
      # tree passed here and failed there, and the gate would have meant
      # whatever version the image happened to carry that month.
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSLf --retry 3 -o /tmp/shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Every shell script, including the two extensionless ones that run as
      # root on production hosts.
      - name: ShellCheck
        run: npm run verify:shell

      # Syntax only -- what these catch is a broken edit, not a broken import.
      # The import side is checked in the other job, against the built output.
      - name: Parse the node scripts
        run: |
          set -euo pipefail
          count=0
          for f in ops/*.mjs ops/*.cjs; do
            node --check "$f"
            count=$((count + 1))
          done
          echo "parsed $count node scripts"

      - name: Parse and test the python ops scripts
        run: |
          set -euo pipefail
          # Every ops/*.py, not a hand-kept list: two scripts had been added
          # since the list was written and neither was being parsed. The count
          # is printed so an empty glob cannot pass as a clean run.
          count=0
          for f in ops/*.py; do
            python3 -m py_compile "$f"
            count=$((count + 1))
          done
          test "$count" -ge 3
          echo "parsed $count python scripts"
          python3 -m unittest discover -s ops/tests -p 'test_*.py' -v

      # The unit is verified against the real command, installed where the unit
      # says it lives: otherwise systemd only reports that the path is missing,
      # which says nothing about the unit.
      - name: Verify the systemd units
        run: |
          set -euo pipefail
          sudo install -m 755 ops/chaos/defcon-chaos /usr/local/sbin/defcon-chaos
          systemd-analyze verify \
            ops/chaos/defcon-chaos-recover.service \
            ops/chaos/defcon-chaos-recover.timer

      # Lint, not build. A real build needs the pre-built `defcond` at the
      # context root -- an artefact this public repository does not and must not
      # carry -- so what can be checked here is the Dockerfile itself.
      - name: Lint the Dockerfile
        run: docker buildx build --check -f docker/Dockerfile .

      # The one test that asks the kernel rather than a fake. Two network
      # namespaces, the real wrapper in one of them, datagrams counted in the
      # other: a 100% loss fault must drop everything from the target's port,
      # nothing from any other port, and `clear` must give the link back. The
      # suite that ran before this used a loss of 0%, so it could not have told
      # a working fault from no fault at all.
      - name: Prove a network fault reaches the network
        run: sudo bash ops/chaos/tests/netns.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The release tarball, pinned by version AND by checksum. An action from
      # the marketplace would be a third party with a token in this repository's
      # build; a binary whose hash is written down here is neither.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf --retry 3 -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Runs twice: the tree must be clean, and a planted credential must trip
      # it. A scanner that reports nothing is indistinguishable from a scanner
      # with no rules loaded.
      - name: Secret gate
        run: npm run verify:secrets
